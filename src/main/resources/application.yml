server:
  port: 8081

spring:
  application:
    name: supplychain-frontend

  # JSP configuration
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

# Backend API URL
# Configurable via BACKEND_API_URL environment variable (e.g. for AKS, Container Apps, App Service)
backend:
  api:
    url: ${BACKEND_API_URL:http://backend:8080/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    com.acme.scm: DEBUG
