apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplychain-frontend
  labels:
    app: supplychain-frontend
    version: "2.0.0-SNAPSHOT"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supplychain-frontend
  template:
    metadata:
      labels:
        app: supplychain-frontend
    spec:
      # Run as the non-root user created in the Dockerfile (UID 1001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: supplychain-frontend
          image: supplychain-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: supplychain-config
                  key: backend-api-url
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Drop all capabilities; add only what Tomcat needs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
