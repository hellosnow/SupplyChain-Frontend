# ---------------------------------------------------------------------------
# Recommended Upgrade Path
# ---------------------------------------------------------------------------
upgradePath:
  phase1_java_upgrade:
    title: "Upgrade Java 8 → 17 LTS"
    effort: "5 story points"
    priority: CRITICAL
    steps:
      - "Update pom.xml: java.version=17, compiler source/target=17"
      - "Update Dockerfile base images to JDK 17"
      - "Test compilation and runtime with JDK 17"
      - "Address any removed/changed APIs (e.g., sun.* internal APIs)"

  phase2_spring_boot_upgrade:
    title: "Upgrade Spring Boot 2.7.18 → 3.2.x+"
    effort: "8 story points"
    priority: CRITICAL
    steps:
      - "Upgrade Spring Boot parent to 3.2.x"
      - "Migrate javax.* → jakarta.* namespace"
      - "Replace javax.servlet:jstl → jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api"
      - "Update RestTemplate → WebClient or RestClient"
      - "Replace @Autowired field injection → constructor injection"
      - "Update test dependencies for JUnit 5 / Spring Boot 3.x"

  phase3_cloud_readiness:
    title: "Cloud-readiness remediation"
    effort: "6 story points"
    priority: HIGH
    steps:
      - "Externalize all hardcoded URLs via environment variables"
      - "Switch HTTP → HTTPS for all service communication"
      - "Add spring-boot-starter-actuator for health/readiness/liveness probes"
      - "Consider converting WAR → JAR packaging"
      - "Add Spring Security with Azure AD (Entra ID) integration"

  phase4_azure_migration:
    title: "Deploy to Azure"
    effort: "Variable"
    priority: MEDIUM
    options:
      - target: Azure Container Apps
        notes: "Recommended for this app. Serverless containers, auto-scaling, easy deployment."
      - target: Azure App Service
        notes: "Good for traditional web apps. Built-in Java/Tomcat support."
      - target: Azure Kubernetes Service (AKS)
        notes: "Best for microservices at scale. More operational overhead."

